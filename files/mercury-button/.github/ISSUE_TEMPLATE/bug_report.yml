name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal HTML snippet or CodePen link helps a lot.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 7, Android 15
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or WebView
      placeholder: Chrome 128 / Android WebView / iOS Safari 18
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mercury-button version
      placeholder: 1.0.0
